# Generated by /setup-ci skill — 週次品質スキャンワークフロー
# Re-run /setup-ci to regenerate after updating quality-checks.md
# プロジェクトタイプに応じて該当セクションのコメントを解除すること

name: Scheduled Quality Check

on:
  schedule:
    - cron: '0 9 * * 1'   # 毎週月曜 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  quality-scan:
    name: Weekly Quality Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Rust プロジェクト ---
      # - uses: dtolnay/rust-toolchain@stable
