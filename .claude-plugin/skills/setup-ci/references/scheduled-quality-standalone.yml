      #     node-version: '{{NODE_VERSION}}'
      #     cache: '{{PACKAGE_MANAGER}}'
      # - run: {{INSTALL_COMMAND}}

      # --- Lockfile 検証 (QC9 / P4-03) ---
      - name: Verify lockfile is committed
        id: lockfile
        continue-on-error: true
        run: |
          FAIL=false
          # Rust
          if [ -f Cargo.toml ] && [ ! -f Cargo.lock ]; then
            echo "::warning::Cargo.lock が見つかりません。'cargo generate-lockfile' を実行してコミットしてください。"
            FAIL=true
          fi
          # Node.js
          if [ -f package.json ]; then
            if [ ! -f package-lock.json ] && [ ! -f yarn.lock ] && [ ! -f pnpm-lock.yaml ]; then
              echo "::warning::lockfile が見つかりません。パッケージマネージャの install コマンドを実行してコミットしてください。"
              FAIL=true
            fi
          fi
          # Go
          if [ -f go.mod ] && [ ! -f go.sum ]; then
            echo "::warning::go.sum が見つかりません。'go mod tidy' を実行してコミットしてください。"
            FAIL=true
          fi
          if [ "$FAIL" = "true" ]; then
            echo "LOCKFILE_MISSING=true" >> "$GITHUB_ENV"
          else
            echo "LOCKFILE_MISSING=false" >> "$GITHUB_ENV"
          fi

      # --- Lint チェック ---
      # - name: Lint check
      #   id: lint
      #   continue-on-error: true
