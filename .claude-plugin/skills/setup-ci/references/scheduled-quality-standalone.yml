      #   continue-on-error: true
      #   run: |
      #     cargo install cargo-audit --locked
      #     cargo audit 2>&1 | tee /tmp/audit-output.txt

      # - name: Security audit (Node.js)
      #   id: audit
      #   continue-on-error: true
      #   run: npm audit --audit-level=high 2>&1 | tee /tmp/audit-output.txt

      # --- 未使用依存関係 ---
      # - name: Unused dependencies
      #   id: unused-deps
      #   continue-on-error: true
      #   run: |
      #     rustup toolchain install nightly --profile minimal
      #     cargo install cargo-udeps --locked
      #     cargo +nightly udeps --quiet 2>&1 | tee /tmp/udeps-output.txt

      # --- コード重複チェック ---
      # - name: Code duplication check
      #   id: duplication
      #   continue-on-error: true
      #   run: |
      #     npx jscpd --min-lines 10 --min-tokens 50 --reporters consoleFull \
      #       --ignore '**/target/**,**/node_modules/**,**/dist/**' \
      #       . 2>&1 | tee /tmp/duplication-output.txt

      # --- ドキュメント Lint (QC10 / P5-03) ---
      # - name: Markdown lint
      #   id: markdown-lint
      #   continue-on-error: true
      #   run: npx markdownlint-cli2 "**/*.md" "#node_modules" "#target" "#dist" 2>&1 | tee /tmp/mdlint-output.txt

      # - name: Link check
      #   id: link-check
      #   continue-on-error: true
      #   run: |
      #     find . -name '*.md' -not -path '*/node_modules/*' -not -path '*/target/*' -not -path '*/.spec-workflow/*' -print0 | \
      #       xargs -0 -I {} npx markdown-link-check {} 2>&1 | tee /tmp/link-check-output.txt

      # --- 分岐カバレッジ (QC13 / plan-redesign #3) ---
      # 該当する言語の step のみコメント解除する。初期は advisory (continue-on-error: true)。
      # 推奨 threshold: line 70% / branch 50% (quality-checks.md QC13 参照、運用しながら段階的に引き上げ)。
      # branch が line より大幅に低い場合はエラーパステスト不足のシグナル。

      # - name: Coverage (Rust / Leptos, line + branch, advisory)
      #   id: coverage-rust
      #   continue-on-error: true
      #   run: |
      #     cargo install cargo-llvm-cov --locked
      #     cargo llvm-cov --branch --json --output-path /tmp/coverage.json --summary-only
      #     LINE=$(jq -r '.data[0].totals.lines.percent' /tmp/coverage.json)
      #     BRANCH=$(jq -r '.data[0].totals.branches.percent' /tmp/coverage.json)
      #     echo "COVERAGE_LINE=$LINE" >> "$GITHUB_ENV"
      #     echo "COVERAGE_BRANCH=$BRANCH" >> "$GITHUB_ENV"
      #     echo "::notice::Line coverage: ${LINE}% / Branch coverage: ${BRANCH}%"

      # - name: Coverage (.NET, line + branch, advisory)
      #   id: coverage-dotnet
      #   continue-on-error: true
      #   run: |
      #     dotnet test --collect:"XPlat Code Coverage" -- \
      #       DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      #     COB=$(find . -name 'coverage.cobertura.xml' -print -quit)
      #     if [ -n "$COB" ]; then
      #       LINE_RATE=$(grep -oP 'line-rate="\K[0-9.]+' "$COB" | head -1)
      #       BRANCH_RATE=$(grep -oP 'branch-rate="\K[0-9.]+' "$COB" | head -1)
      #       LINE=$(awk "BEGIN {printf \"%.1f\", $LINE_RATE * 100}")
      #       BRANCH=$(awk "BEGIN {printf \"%.1f\", $BRANCH_RATE * 100}")
      #       echo "COVERAGE_LINE=$LINE" >> "$GITHUB_ENV"
      #       echo "COVERAGE_BRANCH=$BRANCH" >> "$GITHUB_ENV"
      #       echo "::notice::Line coverage: ${LINE}% / Branch coverage: ${BRANCH}%"
      #     fi

      # - name: Coverage (Node.js, line + branch, advisory)
      #   id: coverage-nodejs
      #   continue-on-error: true
      #   run: |
      #     npx vitest run --coverage --coverage.reporter=json-summary
      #     SUMMARY=coverage/coverage-summary.json
      #     if [ -f "$SUMMARY" ]; then
      #       LINE=$(jq -r '.total.lines.pct' "$SUMMARY")
      #       BRANCH=$(jq -r '.total.branches.pct' "$SUMMARY")
      #       echo "COVERAGE_LINE=$LINE" >> "$GITHUB_ENV"
      #       echo "COVERAGE_BRANCH=$BRANCH" >> "$GITHUB_ENV"
      #       echo "::notice::Line coverage: ${LINE}% / Branch coverage: ${BRANCH}%"
      #     fi

      # --- ドキュメント鮮度チェック ---
      - name: Document freshness check
        id: doc-freshness
        continue-on-error: true
        run: |
          STALE_THRESHOLD_DAYS=90
          STALE_FILES=""
          NOW=$(date +%s)

          # ルールファイル、ADR、ステアリングドキュメントをチェック
          for pattern in ".claude-plugin/rules/*.md" ".claude/_docs/adr/*.md" ".spec-workflow/steering/*.md"; do
            for file in $pattern; do
              [ -f "$file" ] || continue
              LAST_MOD=$(git log -1 --format="%at" -- "$file" 2>/dev/null || echo "0")
              if [ "$LAST_MOD" != "0" ]; then
                AGE_DAYS=$(( (NOW - LAST_MOD) / 86400 ))
                if [ "$AGE_DAYS" -gt "$STALE_THRESHOLD_DAYS" ]; then
                  LAST_DATE=$(git log -1 --format="%ci" -- "$file" | cut -d' ' -f1)
                  STALE_FILES="$STALE_FILES\n| $file | $LAST_DATE | ${AGE_DAYS}d |"
                fi
              fi
            done
          done

          if [ -n "$STALE_FILES" ]; then
            echo "STALE_FOUND=true" >> "$GITHUB_ENV"
            printf "| File | Last Modified | Age |\n|------|--------------|-----|\n%b\n" "$STALE_FILES" > /tmp/stale-docs.txt
          else
            echo "STALE_FOUND=false" >> "$GITHUB_ENV"
            echo "No stale documents found." > /tmp/stale-docs.txt
          fi

      # --- Issue 自動作成 ---
      - name: Create quality issue
        if: always()
        uses: actions/github-script@v7
        env:
          DOC_FRESHNESS_RESULT: ${{ steps.doc-freshness.outcome }}
          STALE_FOUND: ${{ env.STALE_FOUND }}
          LOCKFILE_MISSING: ${{ env.LOCKFILE_MISSING }}
          COVERAGE_LINE: ${{ env.COVERAGE_LINE }}
          COVERAGE_BRANCH: ${{ env.COVERAGE_BRANCH }}
        with:
          script: |
            const fs = require('fs');
            const sections = [];

            // Lockfile 検証
            if (process.env.LOCKFILE_MISSING === 'true') {
              sections.push('### :warning: Lockfile Missing (P4-03)\n\nパッケージマネージャの lockfile がコミットされていません。再現可能なビルドのために lockfile をコミットしてください。');
            }

            // ドキュメント鮮度
            const staleOutput = fs.existsSync('/tmp/stale-docs.txt')
              ? fs.readFileSync('/tmp/stale-docs.txt', 'utf8').trim()
              : '';
            if (process.env.STALE_FOUND === 'true') {
              sections.push(`### :warning: Stale Documents (>90 days)\n\n${staleOutput}`);
            }

            // 分岐カバレッジ (QC13)
            const coverageLine = process.env.COVERAGE_LINE;
            const coverageBranch = process.env.COVERAGE_BRANCH;
            if (coverageLine && coverageBranch) {
              const lineThreshold = 70;
              const branchThreshold = 50;
              const lineNum = parseFloat(coverageLine);
              const branchNum = parseFloat(coverageBranch);
              const lineFail = lineNum < lineThreshold;
              const branchFail = branchNum < branchThreshold;
              const branchGap = lineNum - branchNum;
              if (lineFail || branchFail) {
                let coverageBody = `### :warning: Coverage Below Threshold (QC13)\n\n` +
                  `- Line: ${coverageLine}% (threshold: ${lineThreshold}%)\n` +
                  `- Branch: ${coverageBranch}% (threshold: ${branchThreshold}%)\n`;
                if (branchGap > 30) {
                  coverageBody += `\nBranch coverage が line coverage より ${branchGap.toFixed(1)}pt 低く、` +
                    `エラーパス・例外分岐のテスト不足の signal です。review-worker の E2-4 で finding 起票検討。`;
                }
                sections.push(coverageBody);
              }
            }

            // ドキュメント Lint (P5-03)
            const mdlintOutput = fs.existsSync('/tmp/mdlint-output.txt')
              ? fs.readFileSync('/tmp/mdlint-output.txt', 'utf8').trim()
              : '';
            if (mdlintOutput && mdlintOutput.length > 10) {
              sections.push(`### :warning: Markdown Lint Issues (P5-03)\n\n\`\`\`\n${mdlintOutput.slice(0, 2000)}\n\`\`\``);
            }

            const linkOutput = fs.existsSync('/tmp/link-check-output.txt')
              ? fs.readFileSync('/tmp/link-check-output.txt', 'utf8').trim()
              : '';
            if (linkOutput && linkOutput.includes('ERROR')) {
              sections.push(`### :warning: Broken Links (P5-03)\n\n\`\`\`\n${linkOutput.slice(0, 2000)}\n\`\`\``);
            }

            if (sections.length === 0) {
              console.log('No quality issues found. Skipping issue creation.');
              return;
            }

            const date = new Date().toISOString().split('T')[0];
            const body = [
              `## Weekly Quality Scan — ${date}`,
              '',
              ...sections,
              '',
              '---',
              'Auto-generated by weekly quality scan workflow.',
            ].join('\n');

            // 既存の未解決 Quality Issue を Search API で検索（重複抑止）
            // ラベル未作成・Issue 件数が多い場合でも確実に検出
            const titlePrefix = '[Quality] Weekly scan';
            const { data: searchResult } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${titlePrefix}"`,
              per_page: 1,
            });
            const existingIssue = searchResult.items[0] || null;

            if (existingIssue) {
              // 既存 Issue を更新
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body,
                title: `${titlePrefix} — ${date}`,
              });
            } else {
              // 新規作成
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `${titlePrefix} — ${date}`,
                  body,
                  labels: ['quality', 'automated'],
                });
              } catch (e) {
                // label が存在しない場合は label なしで再試行
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `${titlePrefix} — ${date}`,
                  body,
                });
              }
            }
