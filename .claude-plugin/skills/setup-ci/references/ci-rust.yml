# Generated by /setup-ci skill — mirrors quality-checks.md commands
# Re-run /setup-ci to regenerate after updating quality-checks.md

name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@{{TOOLCHAIN}}
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --quiet --all-targets -- -D warnings

      - name: Tests
        run: cargo test --quiet

      - name: Security audit
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit
