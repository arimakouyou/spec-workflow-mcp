# Generated by /setup-ci --with-auto-merge — 自動マージワークフロー
# dependabot PR および auto-merge ラベル付き PR を自動マージする
# Re-run /setup-ci --with-auto-merge to regenerate
#
# 前提条件（GitHub リポジトリ設定）:
#   - Settings > General > "Allow auto-merge" を有効化
#   - Settings > Branches > Branch protection で必須ステータスチェックを設定
#
# 自動マージ条件 (P6-11):
#   - dependabot PR: CI 全パス → 自動マージ（承認不要）
#   - human PR + "auto-merge" ラベル: CI 全パス + 1人以上の承認 → 自動マージ
#   - human PR（ラベルなし）: 手動マージ

name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # dependabot PR または auto-merge ラベル付き PR のみ
    if: >-
      github.actor == 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
