# Generated by /setup-ci skill — mirrors quality-checks.md commands
# Re-run /setup-ci to regenerate after updating quality-checks.md

name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lockfile verification (QC9)
        run: |
          LOCKFILE=""
          if [ -f package-lock.json ]; then LOCKFILE="package-lock.json";
          elif [ -f yarn.lock ]; then LOCKFILE="yarn.lock";
          elif [ -f pnpm-lock.yaml ]; then LOCKFILE="pnpm-lock.yaml";
          fi
          if [ -z "$LOCKFILE" ]; then
            echo "::error::No lockfile found — reproducible builds require a committed lockfile"
            exit 1
          fi
          if git check-ignore -q "$LOCKFILE" 2>/dev/null; then
            echo "::error::$LOCKFILE is gitignored — lockfiles must be tracked"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '{{NODE_VERSION}}'
          cache: '{{PACKAGE_MANAGER}}'

      - name: Install dependencies
        run: {{INSTALL_COMMAND}}

      - name: Type check
        id: typecheck
        run: npx tsc --noEmit

      - name: Lint
        id: lint
        run: npx eslint . --max-warnings=0

      - name: Format check
        id: format-check
        run: npx prettier --check .

      - name: Tests
        id: tests
        run: |
          set -o pipefail
          {{PACKAGE_MANAGER}} test 2>&1 | tee /tmp/test-output.txt

      - name: Build
        id: build
        run: {{PACKAGE_MANAGER}} run build

      - name: Security audit
        id: security-audit
        run: |
          if [ "{{PACKAGE_MANAGER}}" = "yarn" ]; then
            # Yarn Berry (v2+) は yarn npm audit、v1 は yarn audit
            if yarn --version 2>/dev/null | grep -q '^1\.'; then
              yarn audit --level high
            else
              yarn npm audit --severity high
            fi
          elif [ "{{PACKAGE_MANAGER}}" = "pnpm" ]; then
            pnpm audit --severity high
          else
            npm audit --audit-level=high
          fi

      # --- SAST: セキュリティ特化 lint (P6-04) ---
      # - name: Security lint (eslint-plugin-security)
      #   continue-on-error: true
      #   run: npx eslint --plugin security --rule 'security/detect-object-injection: warn' .

      # --- Flaky test リトライ (P6-08/P6-09) ---
      # - name: Tests (with retry)
      #   id: tests-retry
      #   uses: nick-fields/retry@v3
      #   with:
      #     max_attempts: 3
      #     command: |
      #       set -o pipefail
      #       {{PACKAGE_MANAGER}} test 2>&1 | tee /tmp/test-output.txt

      # --- ドキュメント Lint (QC10 / P5-03) ---
      # - name: Markdown lint
      #   continue-on-error: true
      #   run: npx markdownlint-cli2 "**/*.md" "#node_modules" "#target" "#dist"

      - name: Post CI results to PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          FMT_RESULT: ${{ steps.format-check.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          AUDIT_RESULT: ${{ steps.security-audit.outcome }}
        with:
          script: |
            const fs = require('fs');
            const testOutput = fs.existsSync('/tmp/test-output.txt')
              ? fs.readFileSync('/tmp/test-output.txt', 'utf8').trim().split('\n').slice(-20).join('\n')
              : 'No test output';
            const icon = (r) => r === 'success' ? ':white_check_mark:' : ':x:';
            const tag = '<!-- ci-check-result -->';
            const allPass = [process.env.TYPECHECK_RESULT, process.env.LINT_RESULT,
                             process.env.FMT_RESULT, process.env.TEST_RESULT,
                             process.env.BUILD_RESULT, process.env.AUDIT_RESULT]
                            .every(r => r === 'success');
            const body = [
              tag,
              `## ${allPass ? ':white_check_mark:' : ':x:'} CI Quality Checks`,
              '',
              '| Check | Result |',
              '|-------|--------|',
              `| Type Check | ${icon(process.env.TYPECHECK_RESULT)} |`,
              `| Lint (ESLint) | ${icon(process.env.LINT_RESULT)} |`,
              `| Format (Prettier) | ${icon(process.env.FMT_RESULT)} |`,
              `| Tests | ${icon(process.env.TEST_RESULT)} |`,
              `| Build | ${icon(process.env.BUILD_RESULT)} |`,
              `| Security Audit | ${icon(process.env.AUDIT_RESULT)} |`,
              '',
              '<details><summary>Test output (last 20 lines)</summary>',
              '', '```', testOutput, '```', '',
              '</details>',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(tag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
