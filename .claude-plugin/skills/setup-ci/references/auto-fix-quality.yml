# Generated by /setup-ci --with-auto-fix — 品質 Issue 自動修正ワークフロー
# scheduled-quality.yml が作成した [quality] Issue を Claude Code で自動修正する
# Re-run /setup-ci --with-auto-fix to regenerate
#
# 前提条件:
#   - ANTHROPIC_API_KEY シークレットが設定されていること
#   - Claude Code GitHub Action が利用可能であること
#
# 自動修正フロー (P8-07):
#   1. scheduled-quality.yml → [quality] + [automated] ラベル付き Issue 作成
#   2. この workflow が Issue イベントで起動
#   3. Claude Code が /handle-issue で修正 → /create-pr で PR 作成

name: Auto-fix Quality Issues

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-fix:
    # [quality] + [automated] ラベル付き Issue のみ対象
    if: >-
      contains(github.event.issue.labels.*.name, 'quality') &&
      contains(github.event.issue.labels.*.name, 'automated')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Auto-fix quality issue
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            週次品質スキャンが問題を検出しました。自動修正を実行してください。

            /handle-issue ${{ github.event.issue.number }}

            自動修正が可能な問題（フォーマット違反、未使用依存、doc comment 不足、Stale ドキュメント）の場合:
            修正を実装し /create-pr --closes ${{ github.event.issue.number }} で PR を作成してください。

            自動修正が不適切な問題（セキュリティ脆弱性、設計逸脱）の場合:
            Issue にコメントで理由と推奨アクションを記載してください。
