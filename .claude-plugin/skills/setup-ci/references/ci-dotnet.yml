# Generated by /setup-ci skill — mirrors quality-checks.md QC12 commands
# Re-run /setup-ci to regenerate after updating quality-checks.md
# Target: .NET 10

name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  check:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '{{DOTNET_VERSION}}'

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Format check
        id: format-check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (with Analyzers)
        id: build
        run: dotnet build --no-restore -warnaserror

      - name: Tests
        id: tests
        run: dotnet test --no-build --verbosity quiet 2>&1 | tee /tmp/test-output.txt

      - name: Security audit
        id: security-audit
        run: |
          OUTPUT=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qE "(Critical|High)"; then
            echo "::error::Critical or high severity vulnerabilities found"
            exit 1
          fi

      - name: Redundant dependency check (advisory)
        continue-on-error: true
        run: |
          if dotnet tool list | grep -q snitch; then
            dotnet tool run snitch 2>&1 | head -30
          elif dotnet tool list -g | grep -q snitch; then
            snitch 2>&1 | head -30
          else
            echo "Snitch not installed, skipping redundant dependency check"
          fi

      # --- Blazor WASM ビルド検証 (QC12.6) ---
      # dotnet-blazor プロジェクトの場合のみアンコメント
      # - name: Blazor publish verification
      #   id: blazor-publish
      #   run: dotnet publish -c Release -p:PublishTrimmed=true

      # --- SAST: セキュリティ特化 Analyzer (P6-04) ---
      # - name: Security-focused analyzers
      #   continue-on-error: true
      #   run: dotnet build --no-restore -p:AnalysisLevel=latest-all 2>&1 | grep -E "(CA2[0-9]{3}|CA3[0-9]{3})" || true

      # --- Flaky test リトライ (P6-08/P6-09) ---
      # - name: Tests (with retry)
      #   id: tests-retry
      #   uses: nick-fields/retry@v3
      #   with:
      #     max_attempts: 3
      #     command: dotnet test --no-build --verbosity quiet 2>&1 | tee /tmp/test-output.txt

      # --- Stryker.NET ミューテーションテスト (nightly 推奨) ---
      # - name: Mutation testing (Stryker.NET)
      #   continue-on-error: true
      #   run: |
      #     dotnet tool install -g dotnet-stryker
      #     dotnet stryker --since:main

      # --- ドキュメント Lint (QC10 / P5-03) ---
      # - name: Markdown lint
      #   continue-on-error: true
      #   run: npx markdownlint-cli2 "**/*.md" "#node_modules" "#bin" "#obj"

      - name: Post CI results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          FMT_RESULT: ${{ steps.format-check.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          AUDIT_RESULT: ${{ steps.security-audit.outcome }}
        with:
          script: |
            const fs = require('fs');
            const testOutput = fs.existsSync('/tmp/test-output.txt')
              ? fs.readFileSync('/tmp/test-output.txt', 'utf8').trim().split('\n').slice(-20).join('\n')
              : 'No test output';
            const icon = (r) => r === 'success' ? ':white_check_mark:' : ':x:';
            const tag = '<!-- ci-check-result -->';
            const allPass = [process.env.FMT_RESULT, process.env.BUILD_RESULT,
                             process.env.TEST_RESULT, process.env.AUDIT_RESULT]
                            .every(r => r === 'success');
            const body = [
              tag,
              `## ${allPass ? ':white_check_mark:' : ':x:'} CI Quality Checks (.NET)`,
              '',
              '| Check | Result |',
              '|-------|--------|',
              `| Format (dotnet format) | ${icon(process.env.FMT_RESULT)} |`,
              `| Build (Analyzers) | ${icon(process.env.BUILD_RESULT)} |`,
              `| Tests (xUnit) | ${icon(process.env.TEST_RESULT)} |`,
              `| Security Audit | ${icon(process.env.AUDIT_RESULT)} |`,
              '',
              '<details><summary>Test output (last 20 lines)</summary>',
              '', '```', testOutput, '```', '',
              '</details>',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(tag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
