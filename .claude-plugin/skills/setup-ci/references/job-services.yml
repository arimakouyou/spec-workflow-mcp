# Service container snippets — appended by /setup-ci --with-services
# Paste these entries directly under the job-level `services:` key.
# Indentation assumes `services:` is at 4 spaces (GitHub Actions job level).

      # PostgreSQL
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

