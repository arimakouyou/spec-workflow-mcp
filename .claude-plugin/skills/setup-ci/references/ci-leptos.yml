# Generated by /setup-ci skill — mirrors quality-checks.md commands
# Re-run /setup-ci to regenerate after updating quality-checks.md

name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@{{TOOLCHAIN}}
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --quiet --all-targets -- -D warnings

      - name: Tests
        run: cargo test --quiet

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Unused dependencies (advisory)
        continue-on-error: true
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-udeps --locked
          cargo +nightly udeps --quiet

      - name: Leptos build (SSR + WASM) or WASM clippy fallback
        run: |
          if cargo leptos --version >/dev/null 2>&1 || cargo install cargo-leptos --locked; then
            cargo leptos build
          else
            cargo clippy --quiet --target wasm32-unknown-unknown --no-default-features --features hydrate -- -D warnings
          fi
