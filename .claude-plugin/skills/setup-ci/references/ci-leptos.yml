# Generated by /setup-ci skill — mirrors quality-checks.md commands
# Re-run /setup-ci to regenerate after updating quality-checks.md

name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lockfile verification (QC9)
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::error::Cargo.lock not found — reproducible builds require a committed lockfile"
            exit 1
          fi
          if git check-ignore -q Cargo.lock 2>/dev/null; then
            echo "::error::Cargo.lock is gitignored — lockfiles must be tracked"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: {{TOOLCHAIN}}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        id: format-check
        run: cargo fmt --all -- --check

      - name: Clippy
        id: clippy
        # TS-R4 (unwrap 禁止) を L3 CI で強制: プロダクションコードで unwrap/expect/panic を deny。
        # テストコードでの許可は clippy.toml の allow-*-in-tests で制御 (setup-ci/references/clippy.toml.template)。
        run: |
          cargo clippy --quiet --all-targets -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic

      - name: Tests
        id: tests
        run: |
          set -o pipefail
          cargo test --quiet 2>&1 | tee /tmp/test-output.txt

      - name: Architecture tests (L4)
        id: architecture-tests
        # plan-redesign #15: design.md の Module Boundaries に基づく依存方向 / 循環依存テストを
        # tests/architecture.rs として明示実行。/generate-arch-tests Skill で生成。
        # ファイルが存在しない場合は skip (Module Boundaries 未定義のプロジェクト用)。
        run: |
          if [ -f tests/architecture.rs ]; then
            cargo test --test architecture --quiet
          else
            echo "tests/architecture.rs not found — skipping (run /generate-arch-tests if Module Boundaries are defined)"
          fi

      - name: Component Tests (QC14, wasm-bindgen-test)
        id: component-tests
        # dapper-hardening H-1: Leptos component の reactivity test を
        # cargo test --target wasm32-unknown-unknown で実行（wasm-pack 不要）。
        # .cargo/config.toml に runner = "wasm-bindgen-test-runner" 設定 + Firefox/Chromium 必要。
        # Component test (#[wasm_bindgen_test]) が存在しない場合は skip。
        run: |
          if grep -rq "wasm_bindgen_test" --include="*.rs" . 2>/dev/null; then
            echo "Detected wasm-bindgen-test — running Component Tests"
            # Firefox（snap/apt）or Chromium が必要。CI runner で event 前に install を想定
            cargo test --target wasm32-unknown-unknown --lib --quiet 2>&1 | tee /tmp/ct-output.txt
          else
            echo "No wasm-bindgen-test found — Component Test Gate dormant"
          fi

      - name: Regression Gate (QC16)
        id: regression-gate
        # dapper-hardening J-9: regression_issue_NNN_* test を全件抽出して実行
        run: |
          set -o pipefail
          if grep -rq "regression_issue_" --include="*.rs" . 2>/dev/null; then
            cargo test --workspace --quiet -- regression_issue_ 2>&1 | tee /tmp/regression-output.txt
          else
            echo "No regression_issue_* tests detected — Regression Gate dormant"
          fi

      - name: UT Properties Gate (QC15)
        id: ut-properties-gate
        # dapper-hardening I-2: clippy disallowed-methods で clock/RNG/env/fs/HTTP の
        # 直接呼出を deny-level で禁止
        if: hashFiles('clippy.toml') != ''
        run: |
          if grep -q "disallowed-methods" clippy.toml 2>/dev/null; then
            cargo clippy --all-targets --workspace -- -D clippy::disallowed_methods
          else
            echo "clippy.toml has no disallowed-methods — UT Properties Gate dormant"
          fi

      - name: Mutation testing (cargo-mutants, --in-diff, advisory)
        id: mutation-testing
        # plan-redesign #7: 差分モードで mutation testing を実行。
        # PR で変更された行のみを対象に survived mutant を検出する。
        # 初期は advisory (continue-on-error: true)。安定したら除去して blocking に昇格。
        # cargo-mutants Skill の Core Command Pattern に整合。
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          cargo install cargo-mutants --locked
          BASE_REF="${{ github.base_ref }}"
          BASE_REF="${BASE_REF:-main}"
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff "origin/$BASE_REF" -- '*.rs' > git.diff
          if [ -s git.diff ]; then
            cargo mutants --no-shuffle -vV --in-diff git.diff --timeout 300
          else
            echo "No .rs changes vs $BASE_REF — skipping mutation testing"
          fi
          rm -f git.diff

      - name: Security audit
        id: security-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Unused dependencies (advisory)
        continue-on-error: true
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-udeps --locked
          cargo +nightly udeps --quiet

      - name: Leptos build (SSR + WASM) or WASM clippy fallback
        id: leptos-build
        run: |
          if cargo leptos --version >/dev/null 2>&1 || cargo install cargo-leptos --locked; then
            cargo leptos build
          else
            cargo clippy --quiet --target wasm32-unknown-unknown --no-default-features --features hydrate -- -D warnings
          fi

      # --- SAST: セキュリティ特化 lint (P6-04) ---
      # - name: Security-focused clippy lints
      #   continue-on-error: true
      #   run: cargo clippy --all-targets -- -W clippy::suspicious -W clippy::correctness -W clippy::complexity

      # --- Flaky test リトライ (P6-08/P6-09) ---
      # - name: Tests (with retry)
      #   id: tests-retry
      #   uses: nick-fields/retry@v3
      #   with:
      #     max_attempts: 3
      #     command: |
      #       set -o pipefail
      #       cargo test --quiet 2>&1 | tee /tmp/test-output.txt

      # --- ドキュメント Lint (QC10 / P5-03) ---
      # - name: Markdown lint
      #   continue-on-error: true
      #   run: npx markdownlint-cli2 "**/*.md" "#node_modules" "#target" "#dist"

      - name: Post CI results to PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          FMT_RESULT: ${{ steps.format-check.outcome }}
          CLIPPY_RESULT: ${{ steps.clippy.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          AUDIT_RESULT: ${{ steps.security-audit.outcome }}
          LEPTOS_RESULT: ${{ steps.leptos-build.outcome }}
        with:
          script: |
            const fs = require('fs');
            const testOutput = fs.existsSync('/tmp/test-output.txt')
              ? fs.readFileSync('/tmp/test-output.txt', 'utf8').trim().split('\n').slice(-20).join('\n')
              : 'No test output';
            const icon = (r) => r === 'success' ? ':white_check_mark:' : ':x:';
            const tag = '<!-- ci-check-result -->';
            const allPass = [process.env.FMT_RESULT, process.env.CLIPPY_RESULT,
                             process.env.TEST_RESULT, process.env.AUDIT_RESULT,
                             process.env.LEPTOS_RESULT]
                            .every(r => r === 'success');
            const body = [
              tag,
              `## ${allPass ? ':white_check_mark:' : ':x:'} CI Quality Checks`,
              '',
              '| Check | Result |',
              '|-------|--------|',
              `| Format (rustfmt) | ${icon(process.env.FMT_RESULT)} |`,
              `| Clippy | ${icon(process.env.CLIPPY_RESULT)} |`,
              `| Tests | ${icon(process.env.TEST_RESULT)} |`,
              `| Security Audit | ${icon(process.env.AUDIT_RESULT)} |`,
              `| Leptos Build (SSR + WASM) | ${icon(process.env.LEPTOS_RESULT)} |`,
              '',
              '<details><summary>Test output (last 20 lines)</summary>',
              '', '```', testOutput, '```', '',
              '</details>',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(tag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
