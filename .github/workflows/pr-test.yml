name: Pull Request Test

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check plugin version sync
        run: npm run check:plugin-version

      - name: Validate MDX specs
        run: npm run validate:mdx

      - name: Run unit/integration tests
        run: npm test -- --run

      - name: Build dashboard and server
        run: npm run build

      - name: Generate test approvals
        run: npm run test:generate-approvals

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
